<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双鱼配送管理平台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f8fafc;margin:0}
.sidebar{width:220px;background:#fff;border-right:1px solid #f1f5f9;padding:20px 12px;display:flex;flex-direction:column;height:100vh;position:fixed;left:0;top:0;z-index:100}
.main-content{margin-left:220px;padding:24px;min-height:100vh}
.nav-item{cursor:pointer;padding:10px 16px;border-radius:10px;display:flex;align-items:center;gap:10px;transition:all .2s;font-size:14px;color:#64748b;margin-bottom:4px}
.nav-item:hover{background:#fff7ed;color:#ea580c}
.nav-item.active{background:#ea580c;color:#fff;font-weight:600}
.stat-card{background:#fff;border-radius:12px;padding:16px 20px;border:1px solid #f1f5f9;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-label{font-size:12px;color:#94a3b8;margin-bottom:4px}
.stat-value{font-size:24px;font-weight:700;color:#1e293b}
.stat-sub{font-size:11px;color:#94a3b8;margin-top:2px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.card{background:#fff;border-radius:12px;padding:20px;border:1px solid #f1f5f9;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:16px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-header h2{font-size:22px;font-weight:700;color:#1e293b;margin:0}
.page-header .subtitle{font-size:13px;color:#94a3b8;margin:4px 0 0}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:#ea580c;color:#fff}
.btn-primary:hover{background:#c2410c}
.btn-outline{background:#fff;border:1px solid #e2e8f0;color:#475569}
.btn-outline:hover{background:#f8fafc}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:#f8fafc;padding:10px 14px;text-align:left;font-weight:600;color:#475569;border-bottom:1px solid #f1f5f9}
.data-table td{padding:10px 14px;border-bottom:1px solid #f8fafc;color:#334155}
.data-table tr:hover td{background:#fffbeb}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;background:#f1f5f9;color:#64748b}
.badge-green{background:#dcfce7;color:#16a34a}
.badge-orange{background:#ffedd5;color:#ea580c}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#64748b;margin-bottom:4px;font-weight:500}
.form-group input,.form-group select{width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none}
.form-group input:focus{border-color:#ea580c;box-shadow:0 0 0 3px rgba(234,88,12,.1)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000}
.modal{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-header h3{margin:0;font-size:18px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid #f1f5f9}
.driver-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.driver-card{border:1px solid #f1f5f9;border-radius:12px;padding:16px}
.driver-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.06)}
.driver-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.driver-avatar{width:40px;height:40px;border-radius:10px;background:#ea580c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.driver-name{font-weight:600;color:#1e293b}
.driver-info{font-size:12px;color:#94a3b8}
.driver-stats{display:flex;gap:16px;font-size:12px;color:#64748b;margin-bottom:12px}
.driver-actions{display:flex;gap:8px}
.btn-icon{background:none;border:1px solid #e2e8f0;padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer;color:#64748b}
.btn-icon:hover{background:#f8fafc;color:#ea580c;border-color:#ea580c}
.btn-icon.danger:hover{color:#dc2626;border-color:#dc2626}
.chart-box{position:relative;height:260px}
.driver-photo{width:40px;height:40px;border-radius:10px;object-fit:cover}
.driver-photo-large{width:80px;height:80px;border-radius:12px;object-fit:cover;border:2px solid #f1f5f9}
.photo-upload-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px dashed #e2e8f0;border-radius:6px;font-size:11px;color:#64748b;cursor:pointer;transition:all .2s}
.photo-upload-btn:hover{border-color:#ea580c;color:#ea580c;background:#fff7ed}
.photo-preview{position:relative;display:inline-block}
.photo-delete-btn{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:#dc2626;color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #f1f5f9;padding:8px;z-index:900;justify-content:space-around}
.mobile-nav-item{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#94a3b8;cursor:pointer;padding:4px 8px}
.mobile-nav-item.active{color:#ea580c}
@media(max-width:768px){.sidebar{display:none}.main-content{margin-left:0;padding:12px;padding-bottom:72px}.mobile-nav{display:flex!important}.stats-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="sidebar">
  <div style="margin-bottom:24px;padding:0 8px">
    <h1 style="font-size:18px;font-weight:800;color:#ea580c;margin:0">双鱼配送</h1>
    <p style="font-size:11px;color:#94a3b8;margin:4px 0 0">管理平台 v2.0</p>
  </div>
  <div id="navList"></div>
  <div style="margin-top:auto;padding:12px;background:#f8fafc;border-radius:10px;font-size:11px;color:#94a3b8">
    <p style="margin:0">数据源: GitHub</p>
    <p style="margin:4px 0 0" id="syncStatus">加载中...</p>
    <button onclick="configToken()" style="margin-top:6px;font-size:10px;color:#ea580c;background:none;border:none;cursor:pointer;padding:0">设置Token</button>
  </div>
</div>
<div class="mobile-nav" id="mobileNav"></div>
<div class="main-content" id="main-content"></div>
<div class="modal-overlay" id="modal-overlay"></div>
<script src="app.js"></script>
</body>
</html>
