<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>双宇管理平台</title>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── 全局变量（微信小程序配色体系） ── */
:root {
  --wx-bg:        #f7f8fa;   /* 页面底色 */
  --wx-card:      #ffffff;   /* 卡片白 */
  --wx-primary:   #07c160;   /* 微信绿 */
  --wx-primary-d: #06ad56;   /* 深绿 */
  --wx-blue:      #1989fa;   /* 辅助蓝 */
  --wx-text:      #1a1a1a;   /* 主文字 */
  --wx-text2:     #646566;   /* 次文字 */
  --wx-text3:     #969799;   /* 弱文字 */
  --wx-border:    #ebedf0;   /* 分割线 */
  --wx-shadow:    0 2px 12px rgba(0,0,0,0.08);
  --wx-radius:    12px;
  --wx-radius-sm: 8px;
  --nav-h:        56px;      /* 顶部导航高度 */
  --tab-h:        50px;      /* 底部Tab高度 */
  --cap-h:        32px;      /* 胶囊按钮区高度 */
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC',
               'Helvetica Neue', 'Microsoft YaHei', sans-serif;
  background: var(--wx-bg);
  color: var(--wx-text);
  -webkit-font-smoothing: antialiased;
}

/* ── App Shell ── */
.app-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  background: var(--wx-bg);
}

/* ══════════════════════════════════════
   顶部导航栏（微信小程序风格）
══════════════════════════════════════ */
.wx-nav {
  flex-shrink: 0;
  height: var(--nav-h);
  background: var(--wx-card);
  border-bottom: 1px solid var(--wx-border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  position: relative;
  z-index: 200;
  /* 顶部绿色细线 */
  box-shadow: 0 1px 0 var(--wx-border), inset 0 3px 0 var(--wx-primary);
}

.wx-nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
}
.wx-nav-logo img {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  object-fit: cover;
  border: 1.5px solid var(--wx-border);
}
.wx-nav-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--wx-text);
  letter-spacing: 1px;
}
.wx-nav-title em {
  color: var(--wx-primary);
  font-style: normal;
}

/* 胶囊按钮（右上角，桌面端显示导航tabs） */
.wx-capsule {
  display: flex;
  align-items: center;
  gap: 0;
  border: 1px solid var(--wx-border);
  border-radius: 20px;
  overflow: hidden;
  background: var(--wx-bg);
  flex-shrink: 0;
}
.wx-cap-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--wx-text2);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  border-right: 1px solid var(--wx-border);
}
.wx-cap-btn:last-child { border-right: none; }
.wx-cap-btn:hover { background: var(--wx-bg); color: var(--wx-text); }
.wx-cap-btn.active {
  background: var(--wx-primary);
  color: #fff;
}
.wx-cap-btn .cap-icon { font-size: 15px; }

/* ══════════════════════════════════════
   内容区
══════════════════════════════════════ */
.content-area {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
}

/* ══════════════════════════════════════
   首页
══════════════════════════════════════ */
#homePage {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--wx-bg);
  padding: 0 0 24px;
}

/* 首页顶部 Banner */
.home-banner {
  position: relative;
  height: 200px;
  overflow: hidden;
  background: #1a1a1a;
}
.home-banner-bg {
  position: absolute;
  inset: 0;
  background-image: url('assets_img0.jpeg');
  background-size: cover;
  background-position: center;
  filter: brightness(0.55) saturate(0.8);
}
.home-banner-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,0.1) 0%,
    rgba(0,0,0,0.45) 100%
  );
}
.home-banner-content {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 0 20px;
}
.banner-logo-wrap {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  overflow: hidden;
  border: 2px solid rgba(255,255,255,0.35);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.banner-logo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.banner-title {
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 3px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
.banner-sub {
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  letter-spacing: 2px;
  background: rgba(7,193,96,0.25);
  border: 1px solid rgba(7,193,96,0.4);
  padding: 3px 12px;
  border-radius: 20px;
}

/* 首页内容区 */
.home-body {
  padding: 16px 16px 0;
}

/* 区块标题 */
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--wx-text2);
  letter-spacing: 1px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 13px;
  background: var(--wx-primary);
  border-radius: 2px;
}

/* 功能卡片网格 */
.func-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

.func-card {
  background: var(--wx-card);
  border-radius: var(--wx-radius);
  padding: 20px 16px 16px;
  box-shadow: var(--wx-shadow);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  border: 1px solid var(--wx-border);
  position: relative;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.func-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: var(--wx-radius) var(--wx-radius) 0 0;
}
.func-card.green::before { background: var(--wx-primary); }
.func-card.blue::before  { background: var(--wx-blue); }

.func-card:hover  { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
.func-card:active { transform: scale(0.97); }

.func-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  margin-bottom: 12px;
}
.func-card.green .func-icon { background: rgba(7,193,96,0.1); }
.func-card.blue  .func-icon { background: rgba(25,137,250,0.1); }

.func-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--wx-text);
  margin-bottom: 4px;
}
.func-desc {
  font-size: 12px;
  color: var(--wx-text3);
  line-height: 1.5;
  margin-bottom: 14px;
}
.func-enter {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 500;
  padding: 5px 12px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  transition: opacity 0.15s;
}
.func-card.green .func-enter { background: var(--wx-primary); color: #fff; }
.func-card.blue  .func-enter { background: var(--wx-blue);    color: #fff; }
.func-enter:active { opacity: 0.8; }

/* 状态栏 */
.status-bar {
  background: var(--wx-card);
  border-radius: var(--wx-radius);
  padding: 14px 16px;
  box-shadow: var(--wx-shadow);
  border: 1px solid var(--wx-border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  margin-bottom: 20px;
}
.status-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.status-val {
  font-size: 18px;
  font-weight: 700;
  color: var(--wx-primary);
}
.status-lbl {
  font-size: 11px;
  color: var(--wx-text3);
}
.status-sep {
  width: 1px;
  height: 28px;
  background: var(--wx-border);
}

/* 版本信息 */
.home-footer {
  text-align: center;
  font-size: 11px;
  color: var(--wx-text3);
  padding: 8px 0 4px;
  letter-spacing: 0.5px;
}

/* ══════════════════════════════════════
   iframe 面板
══════════════════════════════════════ */
.iframe-wrap {
  position: absolute;
  inset: 0;
  display: none;
}
.iframe-wrap.active { display: block; }
.iframe-wrap iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  background: #fff;
}

/* 加载遮罩 */
.loading-mask {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: var(--wx-bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  transition: opacity 0.35s;
}
.loading-mask.fade-out { opacity: 0; pointer-events: none; }
.spinner {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 3px solid var(--wx-border);
  border-top-color: var(--wx-primary);
  animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-label {
  font-size: 13px;
  color: var(--wx-text3);
  letter-spacing: 1px;
}

/* ══════════════════════════════════════
   底部 Tab Bar（微信小程序风格）
══════════════════════════════════════ */
.wx-tabbar {
  flex-shrink: 0;
  height: var(--tab-h);
  background: var(--wx-card);
  border-top: 1px solid var(--wx-border);
  display: flex;
  align-items: stretch;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 200;
}
.wx-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border: none;
  background: transparent;
  cursor: pointer;
  color: var(--wx-text3);
  transition: color 0.15s;
  -webkit-tap-highlight-color: transparent;
  min-height: 44px;
  padding: 4px 2px;
}
.wx-tab.active { color: var(--wx-primary); }
.wx-tab .t-icon { font-size: 22px; line-height: 1; }
.wx-tab .t-label { font-size: 10px; font-weight: 500; letter-spacing: 0.3px; }

/* ══════════════════════════════════════
   桌面端（> 768px）：隐藏底部Tab，显示胶囊
══════════════════════════════════════ */
@media (min-width: 769px) {
  .wx-tabbar { display: none; }
  .wx-capsule { display: flex; }

  /* 桌面首页：两列卡片更宽 */
  .func-grid { grid-template-columns: 1fr 1fr; max-width: 600px; }
  #homePage { display: flex; flex-direction: column; align-items: center; }
  .home-banner { width: 100%; }
  .home-body { width: 100%; max-width: 640px; }
}

/* ══════════════════════════════════════
   手机端（≤ 768px）：隐藏胶囊，显示底部Tab
══════════════════════════════════════ */
@media (max-width: 768px) {
  .wx-capsule { display: none; }
  .wx-tabbar { display: flex; }

  .home-banner { height: 160px; }
  .banner-title { font-size: 20px; }
  .banner-logo-wrap { width: 52px; height: 52px; }

  .func-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .func-card { padding: 16px 12px 12px; }
  .func-icon { width: 38px; height: 38px; font-size: 19px; margin-bottom: 10px; }
  .func-name { font-size: 14px; }
  .func-desc { font-size: 11px; margin-bottom: 10px; }
  .func-enter { font-size: 11px; padding: 4px 10px; }

  .func-card:hover { transform: none; }
  .func-card:active { transform: scale(0.97); }
}

/* 超小屏 */
@media (max-width: 360px) {
  .func-grid { grid-template-columns: 1fr; }
  .func-card { padding: 14px 14px 12px; }
}
</style>
</head>
<body>
<div class="app-shell">

  <!-- 顶部导航 -->
  <nav class="wx-nav">
    <div class="wx-nav-logo">
      <img src="assets_img1.jpeg" alt="logo">
      <span class="wx-nav-title"><em>双宇</em>管理平台</span>
    </div>
    <!-- 胶囊按钮（桌面端） -->
    <div class="wx-capsule">
      <button class="wx-cap-btn active" id="capHome" onclick="switchPage('home')">
        <span class="cap-icon">🏠</span> 首页
      </button>
      <button class="wx-cap-btn" id="capSongShu" onclick="switchPage('songshu')">
        <span class="cap-icon">🐿️</span> 松鼠看板
      </button>
      <button class="wx-cap-btn" id="capJiZhiDa" onclick="switchPage('jizhida')">
        <span class="cap-icon">💧</span> 吉之达
      </button>
    </div>
  </nav>

  <!-- 内容区 -->
  <div class="content-area">

    <!-- 首页 -->
    <div id="homePage">
      <!-- Banner -->
      <div class="home-banner">
        <div class="home-banner-bg"></div>
        <div class="home-banner-overlay"></div>
        <div class="home-banner-content">
          <div class="banner-logo-wrap">
            <img src="assets_img2.jpeg" alt="双宇">
          </div>
          <div class="banner-title">双宇管理平台</div>
          <div class="banner-sub">SHUANGYU MANAGEMENT</div>
        </div>
      </div>

      <!-- 主体内容 -->
      <div class="home-body">

        <!-- 状态栏 -->
        <div class="status-bar" style="margin-top:16px;">
          <div class="status-item">
            <div class="status-val">2</div>
            <div class="status-lbl">系统模块</div>
          </div>
          <div class="status-sep"></div>
          <div class="status-item">
            <div class="status-val" style="color:var(--wx-blue);">在线</div>
            <div class="status-lbl">运行状态</div>
          </div>
          <div class="status-sep"></div>
          <div class="status-item">
            <div class="status-val">本地</div>
            <div class="status-lbl">数据存储</div>
          </div>
        </div>

        <!-- 功能入口 -->
        <div class="section-title">功能模块</div>
        <div class="func-grid">

          <!-- 松鼠项目看板 -->
          <div class="func-card green" onclick="switchPage('songshu')">
            <div class="func-icon">🐿️</div>
            <div class="func-name">松鼠项目看板</div>
            <div class="func-desc">项目进度追踪与任务管理</div>
            <button class="func-enter" onclick="event.stopPropagation();switchPage('songshu')">
              进入 →
            </button>
          </div>

          <!-- 吉之达送水 -->
          <div class="func-card blue" onclick="switchPage('jizhida')">
            <div class="func-icon">💧</div>
            <div class="func-name">吉之达送水</div>
            <div class="func-desc">送水订单与配送管理</div>
            <button class="func-enter" onclick="event.stopPropagation();switchPage('jizhida')">
              进入 →
            </button>
          </div>

        </div>

        <!-- 底部版本信息 -->
        <div class="home-footer">双宇管理平台 · 本地版 v2.0</div>

      </div>
    </div>

    <!-- 松鼠项目看板 iframe -->
    <div class="iframe-wrap" id="frameSongShu">
      <div class="loading-mask" id="maskSongShu">
        <div class="spinner"></div>
        <div class="loading-label">正在加载 松鼠项目看板 ...</div>
      </div>
      <iframe id="iframeSongShu" title="松鼠项目看板"></iframe>
    </div>

    <!-- 吉之达送水 iframe -->
    <div class="iframe-wrap" id="frameJiZhiDa">
      <div class="loading-mask" id="maskJiZhiDa">
        <div class="spinner"></div>
        <div class="loading-label">正在加载 吉之达送水 ...</div>
      </div>
      <iframe id="iframeJiZhiDa" title="吉之达送水"></iframe>
    </div>

  </div>

  <!-- 底部 Tab Bar（手机端） -->
  <nav class="wx-tabbar">
    <button class="wx-tab active" id="btabHome" onclick="switchPage('home')">
      <span class="t-icon">🏠</span>
      <span class="t-label">首页</span>
    </button>
    <button class="wx-tab" id="btabSongShu" onclick="switchPage('songshu')">
      <span class="t-icon">🐿️</span>
      <span class="t-label">松鼠看板</span>
    </button>
    <button class="wx-tab" id="btabJiZhiDa" onclick="switchPage('jizhida')">
      <span class="t-icon">💧</span>
      <span class="t-label">吉之达</span>
    </button>
  </nav>

</div>

<script>
var loaded = { songshu: false, jizhida: false };

var PAGE_MAP = {
  home:    { cap: 'capHome',    btab: 'btabHome'    },
  songshu: { cap: 'capSongShu', btab: 'btabSongShu' },
  jizhida: { cap: 'capJiZhiDa',btab: 'btabJiZhiDa' }
};

function switchPage(page) {
  // 清除所有激活态
  document.querySelectorAll('.wx-cap-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelectorAll('.wx-tab').forEach(function(b){ b.classList.remove('active'); });

  // 激活对应按钮
  var m = PAGE_MAP[page];
  if (m) {
    var cap  = document.getElementById(m.cap);
    var btab = document.getElementById(m.btab);
    if (cap)  cap.classList.add('active');
    if (btab) btab.classList.add('active');
  }

  // 隐藏所有面板
  var hp = document.getElementById('homePage');
  hp.style.display = 'none';
  document.getElementById('frameSongShu').classList.remove('active');
  document.getElementById('frameJiZhiDa').classList.remove('active');

  // 显示目标面板
  if (page === 'home') {
    hp.style.display = '';

  } else if (page === 'songshu') {
    document.getElementById('frameSongShu').classList.add('active');
    if (!loaded.songshu) {
      loaded.songshu = true;
      var iframe = document.getElementById('iframeSongShu');
      iframe.src = '松鼠项目看板.html';
      iframe.onload = function(){ hideMask('maskSongShu'); };
    }

  } else if (page === 'jizhida') {
    document.getElementById('frameJiZhiDa').classList.add('active');
    if (!loaded.jizhida) {
      loaded.jizhida = true;
      var iframe = document.getElementById('iframeJiZhiDa');
      iframe.src = '吉之达送水.html';
      iframe.onload = function(){ hideMask('maskJiZhiDa'); };
    }
  }
}

function hideMask(id) {
  var mask = document.getElementById(id);
  if (!mask) return;
  mask.classList.add('fade-out');
  setTimeout(function(){ mask.style.display = 'none'; }, 380);
}
</script>
</body>
</html>
